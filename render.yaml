services:
  - type: web
    name: skillbridge-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_URL
        value: https://skillbridge-ai-self-iota.vercel.app
      - key: BACKEND_URL
        fromService:
          name: skillbridge-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gpt-4o-mini
